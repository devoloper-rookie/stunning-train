<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>School Club Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body id="pageBody">
    <header>
        <div class="logo">CampusConnect</div>
        <div id="navLinks">
            <span id="nav1">All Clubs</span> | 
            <span id="nav2">Events</span>
        </div>
        <button id="joinBtn">Join Now</button>
    </header>

    <div class="accessibility-bar">
        <button onclick="changeLang('hi')">हिन्दी</button>
        <button onclick="changeLang('en')">English</button>
        <button onclick="toggleContrast()">Contrast</button>
        <button onclick="changeSize()">Text Size</button>
    </div>

    <div class="container">
        <h1 id="mainHeading">Explore Student Clubs</h1>
        <p id="subHeading">Find your interest and join a community today.</p>

        <div class="club-grid">
            <div class="club-card">
                <h2 id="c1-title">Coding Club</h2>
                <p id="c1-desc">Learn web development and competitive programming.</p>
                <button class="club-card-view-details">View Details</button>
            </div>

            <div class="club-card">
                <h2 id="c2-title">Art Guild</h2>
                <p id="c2-desc">Sketching, painting, and digital art workshops.</p>
                <button class="club-card-view-details">View Details</button>
            </div>

            <div class="club-card">
                <h2 id="c3-title">Music Band</h2>
                    <p id="c3-desc">For instrumentalists and vocalists of all genres.</p>
                    <button class="club-card-view-details">View Details</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
